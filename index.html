<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>赤兔文创 · 创享办公社区</title>

  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">

<body>
  <header class="header" id="header">
    <div class="container nav-container">
      <a href="#" class="logo">
        <img src="assets/logo.png" alt="赤兔文创 KEY TEAM">
      </a>
      <nav class="nav" id="nav">
        <a href="#about">品牌</a>
        <a href="#locations">门店</a>
        <a href="#gallery">实景</a>

        <a href="#subsidy">企业补贴</a>
        <a href="#faq">FAQ</a>

      <button class="menu-toggle" id="menuToggle" aria-label="切换菜单">
        <span></span><span></span><span></span>
      </button>

  </header>

  <main>
    <section class="hero" id="about">
      <div class="hero-carousel" id="hero-carousel" aria-hidden="true"></div>
      <div class="hero-overlay" aria-hidden="true"></div>
      <div class="container hero-content">
        <div class="hero-text" id="hero-text"></div>
        <div class="hero-visual" id="hero-visual"></div>
      </div>
    </section>

    <section class="section section-light">
      <div class="container">
        <div class="section-header" id="features-header"></div>
        <div class="features" id="features-list"></div>
      </div>
    </section>

    <section class="section section-green" id="locations">
      <div class="container">
        <div class="section-header" id="locations-header"></div>
        <div class="locations" id="locations-list"></div>
      </div>
    </section>

    <section class="section section-white">
      <div class="container" id="banner-container"></div>
    </section>

    <section class="section section-white" id="gallery">
      <div class="container">
        <div class="section-header" id="gallery-header"></div>
        <div class="gallery-grid" id="gallery-list"></div>

    <section class="section section-light" id="services">
      <div class="container">
        <div class="section-header" id="services-header"></div>
        <div class="services" id="services-list"></div>
      </div>
    </section>

    <section class="section section-green" id="subsidy">
      <div class="container">
        <div class="section-header" id="subsidy-header"></div>
        <div class="subsidy-grid" id="subsidy-list"></div>
      </div>
    </section>

    <section class="section section-white" id="faq">
      <div class="container narrow">
        <div class="section-header" id="faq-header"></div>
        <div class="faq-list" id="faq-list"></div>
      </div>
    </section>

    <section class="section cta-section" id="contact">
      <div class="container cta-content" id="contact-content"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-grid" id="footer-grid"></div>
    <div class="container footer-copy" id="footer-copy"></div>
  </footer>

  <a href="tel:18102220465" class="float-cta" aria-label="电话咨询">
